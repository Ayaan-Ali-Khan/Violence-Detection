seed: 42
deterministic: false
model:
  variant: x3d_s
  pretrained: true
  num_classes: 2
  freeze_backbone_epochs: 0
data:
  manifest: data/splits/rwf2000.csv
  preprocess_config: configs/preprocess.yaml
  input_tag: rwf_full_f16_s160_v1
  mode: full
  cache_dir: /kaggle/working/tensor_cache/rwf2000
training:
  epochs: 25
  patience: 5
  per_gpu_batch_size: 8
  workers_per_rank: 2
  cpu_threads_per_rank: 2
  prefetch_factor: 2
  learning_rate_backbone: 0.0001
  learning_rate_head: 0.0003
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  amp: true
  log_every_steps: 20
tracking:
  backend: wandb
  project: violence-detection
  run_name: x3d-s-rwf2000-full-frame
  tags: [phase-4, x3d-s, full-frame, rwf2000]
