seed: 42
deterministic: false
model:
  architecture: swin3d_t
  variant: swin3d_t
  pretrained: true
  num_classes: 2
data:
  manifest: data/splits/rwf2000.csv
  preprocess_config: configs/preprocess_crops.yaml
  input_tag: rwf_fullcrop_f16_s160_tau2p00_m0p10_v1
  mode: both
  cache_dir: /kaggle/working/tensor_cache/rwf2000
training:
  epochs: 15
  patience: 3
  per_gpu_batch_size: 1
  workers_per_rank: 2
  cpu_threads_per_rank: 2
  prefetch_factor: 2
  learning_rate_backbone: 0.00001
  learning_rate_head: 0.00005
  weight_decay: 0.02
  gradient_clip_norm: 1.0
  amp: true
  log_every_steps: 20
tracking:
  backend: wandb
  project: violence-detection
  run_name: swin3d-t-rwf2000-paired-views
  tags: [phase-6, swin3d-t, paired-views, rwf2000]
