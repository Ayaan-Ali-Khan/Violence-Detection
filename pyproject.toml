[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "violence-detection"
version = "0.1.0"
description = "Video violence detection using person detection, tracking, and action recognition."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "tqdm>=4.66,<5.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
video = [
    "torch>=2.5",
    "torchvision>=0.20",
    "pytorchvideo>=0.1.5",
    "ultralytics>=8.3,<9.0",
]
dev = [
    "black>=24.10,<27.0",
    "ruff>=0.11,<1.0",
    "pytest>=8.0,<10.0",
    "ipykernel>=6.29,<8.0",
    "jupyterlab>=4.2,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["violence_detection*"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "cache",
    "data/raw",
    "model_checkpoints",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"